<script src="ScratchPad/jslib/diff.min.js"></script>

<script type="text/javascript">
(function() {

   var globalYourConfigNode = null;

window.scratchPadResetDiff = [
    () => {
        $('#node-input-scratchpad-diff-content').html('')
        $('.selected-for-compare').removeClass('selected-for-compare')        
    }
]

function generateDiff(content1, content2) {
    let diff = Diff.diffLines(content1, content2)

    const fragment = document.createDocumentFragment();

    let btn = document.createElement('button')
    
    btn.setAttribute('onclick',"window.scratchPadResetDiff.map( d => d() ); ")
    btn.setAttribute('class','button')
    btn.setAttribute('title','Clear')

    let xsym = document.createElement('i')
    xsym.setAttribute('class','fa fa-close')
    btn.appendChild(xsym)
    fragment.append(btn)

    let span = document.createElement('span')
    if (diff.length == 1 && !diff[0].added && !diff[0].removed) {
        span.setAttribute('style', 'margin-left: 10px; color: green')
        span.innerHTML = "No changes"
    } else {
        let chgcnt = diff.filter(d => d.added || d.removed).length
        span.setAttribute('style', 'margin-left: 10px; color: red')
        span.innerHTML = `${chgcnt} change${chgcnt > 1 ? "s" : ""}`
    }

    fragment.append(span)
    fragment.append(document.createElement('br'))

    diff.forEach((part) => {
        // green for additions, red for deletions
        const color = part.added ? 'green' : part.removed ? 'red' : '#040506';

        let span = document.createElement('pre');
        span.setAttribute('class', 'dv-pre-elem');
        span.style.color = color;
        span.appendChild(document.createTextNode(part.value));
        span.appendChild(document.createElement('br'));
        fragment.appendChild(span);
    });

    $('#node-input-scratchpad-diff-content').html(fragment)
}

function addEventHandlers(cfgnode) {
    let firstObj = undefined

    window.scratchPadResetDiff.push( () => { firstObj = undefined })
    
    $('.scratchpad-compare-btn').off('click')
    $('.scratchpad-compare-btn').on('click', e => {
        if (e) { e.preventDefault() }

        let btnObj = $(e.target).closest('button')

        if ( firstObj ) {
            let content1 = $($(firstObj).closest(".scratchpad-content")).find(".scratchpad-content-field").val()
            let content2 = $($(btnObj).closest(".scratchpad-content")).find(".scratchpad-content-field").val()

            let diffResults = generateDiff(content1, content2)

            $('#node-input-scratchpad-diff-status').html(diffResults)

            $(btnObj).addClass('selected-for-compare')
        } else {
            firstObj = btnObj
            $(firstObj).addClass('selected-for-compare')
        }
    })

    $('.scratchpad-save-btn').off('click')
    $('.scratchpad-save-btn').on('click', e => {
        if (e) { e.preventDefault() }
        cfgnode.scratches ||= []

        $(".scratchpad-content").map((idx, obj) => {
            cfgnode.scratches[idx] = {
                txt: $(obj).find(".scratchpad-content-field").val(),
                hgt: $(obj).find(".scratchpad-content-field").css('height'),
                wdh: $(obj).find(".scratchpad-content-field").css('width')
            }
        })

        RED.nodes.dirty(true)
    })

    $('.scratchpad-close-btn').off('click')
    $('.scratchpad-close-btn').on('click', e => {
        if (e) { e.preventDefault() }

        $(".scratchpad-close-btn").map((idx, obj) => {
            if (obj == e.target) {
                delete cfgnode.scratches[idx]
                $($(e.target).closest(".scratchpad-content")).fadeOut(300, () => {
                    $($(e.target).closest(".scratchpad-content")).remove()
                    RED.nodes.dirty(true)
                })
            }
        })
    })

    $('.scratchpad-clear-btn').off('click')
    $('.scratchpad-clear-btn').on('click', e => {
        if (e) { e.preventDefault() }

        $(".scratchpad-clear-btn").map((idx, obj) => {
            if (obj == e.target) {
                $($($(e.target).closest(".scratchpad-content")).find(".scratchpad-content-field")).val("")
                if ( cfgnode.scratches[idx].txt !== "") {
                    cfgnode.scratches[idx].txt = ""
                    RED.nodes.dirty(true)
                }
            }
        })
    })

    $('.scratchpad-copy-btn').off('click')
    $('.scratchpad-copy-btn').on('click', e => {
        if (e) { e.preventDefault() }

        $(".scratchpad-copy-btn").map((idx, obj) => {
            if (obj == e.target) {
                let content = $($($(e.target).closest(".scratchpad-content")).find(".scratchpad-content-field")).val()
                if (RED.clipboard.copyText(content)) {
                    RED.notify("Content copied", { type: "success" });
                }                 
            }
        })
    })

    $('.scratchpad-execute-btn').off('click')
    $('.scratchpad-execute-btn').on('click', e => {
        if (e) { e.preventDefault() }

        $(".scratchpad-execute-btn").map((idx, obj) => {
            if (obj == e.target) {
                let content = $($($(e.target).closest(".scratchpad-content")).find(".scratchpad-content-field")).val()
                if (content) {
                    (function(){
                        eval(content)
                    })()
                    RED.notify("Content executed", { type: "success" });
                }
            }
        })
    })    
}

function addScratch(content) {
    $('#node-input-scratchpad-fields').prepend(
        $('[data-template-name="ScratchPad-empty-field"]').html()
    )
    $($('#node-input-scratchpad-fields').find('.scratchpad-content-field')[0]).val(content)
}

function ensureYourConfigNodeExists() {
    // This function makes sure there is 1 instance of your config node is available, and that the globalYourConfigNode variable refers to it.
    // Explained in the next step of this tutorial... --> https://discourse.nodered.org/t/tutorial-create-a-sidebar-plugin-and-persist-the-data-in-a-config-node/82020

    // If we had found it previously, check if it has been deleted by the user behind our back
    if (globalYourConfigNode !== null) {
        var configNode = RED.nodes.node(globalYourConfigNode.id);
        if (configNode === null) { globalYourConfigNode = null; }
    }

    // If not found previously, let's go find it
    if (globalYourConfigNode === null) {
        var configNodes = [];
        RED.nodes.eachConfig(function (configNode) {
            if (configNode.type === 'ScratchPadCfg') {
                configNodes.push(configNode);
            }
        });

        // Make sure we only have 1 config node
        while (configNodes.length > 1) {
            var configNode = configNodes.pop();
            RED.nodes.remove(configNode.id);
        }

        // When we found a config node, let's use that one
        if (configNodes.length === 1) { globalYourConfigNode = configNodes[0]; }
    }

    // When it doesn't exist yet, create it if required
    if (globalYourConfigNode === null) {
        // Remark: since this config node is dynamically created (and only used in this sidebar which isn't another node), the config
        // node is in fact "unused".  But since we don't want it to appear "unused" in the "config nodes" panel, we need to set hasUsers
        // to false (see https://github.com/node-red/node-red/blob/master/CHANGELOG.md#0161-maintenance-release).
        // The hasUsers needs also to be specified in the RED.nodes.registerType statement!
        globalYourConfigNode = {
            id: RED.nodes.id(), // on the server side, this is called RED.util.generateId()
            _def: RED.nodes.getType("ScratchPadCfg"),
            type: "ScratchPadCfg",
            hasUsers: false,
            users: [],
            name: "ScratchPad",
            label: function () { return this.name || "ScratchPad" },
            /* values and data defined by this config node */
            scratches: [],
        }

        // Add the new config node to the collection of Node-RED nodes
        RED.nodes.add(globalYourConfigNode);
    }
}


   // Add your plugin as a new tabsheet in the right sidebar AFTER the flow editor is completely started
   var setupSidebarForScratchpad = () => {
      // The html content of the sidebar has been specified below as a data-template, from where it can be loaded:
      var content = $($('script[type="text/x-red"][data-template-name="ScratchPad"]').i18n().html());
    
      // Add a "Your sidebar" tabsheet to the right sidebar panel, in which this sidebar panel can be displayed
      // --> more details: https://nodered.org/docs/api/ui/sidebar/
      RED.sidebar.addTab({
         id: "ScratchPad",
         label: "*scratch*", // short name for the tab
         name: "Scratch Pad", // long name for the menu
         content: content,
         closeable: true,
         enableOnEdit: true,
         iconClass: "fa fa-pencil-square-o" // your fontawesome icon
      });

      $('#node-input-scratchpad-add-btn').on('click', e => {
         if ( e ) { e.preventDefault() }

         if (RED.view.selection().nodes) {
            RED.view.selection().nodes.forEach( nde => {
               let content = ""
               if (nde.type == "template" || nde.type == "PkgFile") {
                  content = nde.template
               } else if (nde.type == "switch" || nde.type == "change") {
                  content = JSON.stringify(RED.nodes.createExportableNodeSet([nde])[0],null,2)
               } else if (nde.type == "function") {
                  content = nde.func
               } else if (nde.type == "ClientCode") {
                  content = nde.clientcode
               } else if (nde._def.category === "mindmap") {
                  content = nde._def.generateMarkdown.call(nde)
               } else if (typeof nde._def.info === "function") {
                  content = nde._def.info.call(nde)
               } else {
                  content = nde.info
               }
               addScratch(content)
            })
         } else {
            addScratch()
         }
         
         addEventHandlers(globalYourConfigNode)
      });

      // do this after the config node has become available
      let initialiseSidebarForm = () => {
         RED.events.off('flows:loaded', initialiseSidebarForm);
         
         ensureYourConfigNodeExists();
         
         globalYourConfigNode.scratches.forEach( sth => {
            addScratch()
         });

         $(".scratchpad-content").map( (idx,obj) => {
            if ( typeof globalYourConfigNode.scratches[idx] === "string") {
               globalYourConfigNode.scratches[idx] = { "txt": globalYourConfigNode.scratches[idx] }
            }
            
            if ( globalYourConfigNode.scratches[idx] ) {
               $(obj).find(".scratchpad-content-field").val( 
                  globalYourConfigNode.scratches[idx].txt 
               ).css( 
                  'width', globalYourConfigNode.scratches[idx].wdh || "360px"
               ).css(
                  'height', globalYourConfigNode.scratches[idx].hgt || "150px"
               )
            }
         });

         (function () {
    let presentermodepackagedevelopment = () => {
        // show the right sidebar
        if (!$("#red-ui-sidebar-separator").is(":visible")) {
            RED.actions.invoke("core:toggle-right-sidebar")
        }

        // show the left sidebar
        if (!$("#red-ui-sidebar-left-separator").is(":visible")) {
            RED.actions.invoke("core:toggle-left-sidebar")
        }

        // show the four panels
        if (!$('.red-ui-debug-container').is(":visible")) {
            $('[data-tab-id=debug]').trigger('click')
        }

        if (!$('#node-input-scratchpad-fields').is(":visible")) {
            $('[data-tab-id=ScratchPad]').trigger('click')
        }

        if (!$('#node-input-flowcompare-target-container-div').is(":visible")) {
            $('[data-tab-id=FlowCompare]').trigger('click')
        }

        if (!$('#func-flowhub-tabs-content').is(":visible")) {
            $('[data-tab-id=FlowHubDiff]').trigger('click')
        }

        // if coming from presentor more, footer might be hidden
        if (!$('#red-ui-workspace-footer').is(":visible")) {
            $('#red-ui-workspace-footer').toggle()
            $('#red-ui-workspace-scroll-h').css('bottom', '36px')
        }
    }

    let actionName = "presenter-mode:package-development-mode"
    let modeName = "Package Development"

    RED.actions.remove(actionName)

    if (RED.presenterMode) {
        RED.presenterMode.add(modeName, presentermodepackagedevelopment)

        RED.actions.add(actionName, () => {
            presentermodepackagedevelopment()
            RED.notify(`Activated ${modeName} mode`, { type: "success" })
        })
    } else {
        RED.events.on("presenter-mode:initialised", () => {
            RED.actions.add(actionName, () => {
                presentermodepackagedevelopment()
                RED.notify(`Activated ${modeName} mode`, { type: "success" })
            })

            RED.presenterMode.add(modeName, presentermodepackagedevelopment)
        })
    }
})();


         addEventHandlers(globalYourConfigNode);
      }
      RED.events.on('flows:loaded', initialiseSidebarForm);
   };

   RED.plugins.registerPlugin("scratchpad-sidebar-plugin", { onadd: setupSidebarForScratchpad });
})();
</script>

<style>
.selected-for-compare {
    background-color: rgba(235, 108, 108, 0.387) !important;
    color: green !important;
}

.button-icon {
    pointer-events: none;
}

</style>

<!-- The html for the right sidebar plugin screen -->

   <div class="scratchpad-content">
      <div class="form-row" style="margin-left: 10px;">
         <textarea class="scratchpad-content-field" placeholder="*scratch*" style="width: 360px; height: 150px;"></textarea>
      </div>
      <div class="form-row scratchpad-content-container" style="margin-left: 10px; margin-top: -15px; margin-bottom: 20px;">
         <button title="Clear" class="scratchpad-clear-btn button"><i class="fa fa-trash-o button-icon"></i></button>
         <button title="Save" class="scratchpad-save-btn button"><i class="fa fa-save button-icon"></i></button>
         <button title="Copy" class="scratchpad-copy-btn button"><i class="fa fa-copy button-icon"></i></button>
         <button title="Compare" class="scratchpad-compare-btn button"><i class="fa fa-balance-scale button-icon"></i></button>
         <button title="Delete" class="scratchpad-close-btn button"><i class="fa fa-close button-icon"></i></button>
         <button title="Browser Execute" class="scratchpad-execute-btn button"><i class="fa fa-play button-icon"></i></button>
      </div>
   </div>
</script>

<script type="text/x-red" data-template-name="ScratchPad">
   <div style="position: relative; height: 100%; overflow-y: auto;">
      <div class="form-row" style="margin-left: 10px; margin-top: 30px;">
         <button title="Add Scratch" class="button" id="node-input-scratchpad-add-btn"><i class="fa fa-plus"></i></button>
      </div>

      <div style="margin: 10px;" id="node-input-scratchpad-diff-content">
      </div>

      <div id="node-input-scratchpad-fields">
      </div>
   </div>
</script>
